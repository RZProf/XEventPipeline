Settings:
  BoundedCapacity: 100000

SqlServer:
  ConnectionString: test_connestion_string
  Events:
    - Name: sqlserver.sp_statement_completed
      CustomizableAttributes:
        - Name: collect_statement
          Value: 1
      Actions:
        - sqlserver.client_app_name
        - sqlserver.client_hostname
        - sqlserver.database_name
        - sqlserver.query_hash
        - sqlserver.username
      PredicateExpression: "[duration]>= 5000000"
    - Name: sqlserver.sql_batch_completed
      CustomizableAttributes:
        - Name: collect_batch_text
          Value: 1
      Actions:
        - sqlserver.client_app_name
        - sqlserver.client_hostname
        - sqlserver.database_name
        - sqlserver.query_hash
        - sqlserver.username
      PredicateExpression: "[duration]>= 5000000"

ClickHouse:
  ConnectionString: test_connestion_string
  BatchSize: 10000

Postgres:
  ConnectionString: test_connestion_string
  BatchSize: 10000

Kafka:
  BrokerAddress: test_broker_address
  Topic: topic_name
  CompressionType: None
  LingerMs: 5
  BatchSize: 10000